<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Workshop / identity emblem for Zoom, Tilt, & Rotate. Same family look as the other Tower mods: dark ground,
     gold frame, parchment art, serif wordmark. Motif: the mod's three camera dials on one panel, the zoom gauge,
     the compass and the angle gauge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243042"/>
      <stop offset="100%" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7eed1"/>
      <stop offset="100%" stop-color="#e7d4a3"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9b55e"/>
      <stop offset="100%" stop-color="#b8903f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e7d4a3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e7d4a3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="26" y="26" width="972" height="972" rx="30" fill="none" stroke="#c9a24c" stroke-width="4" opacity="0.5"/>
  <circle cx="512" cy="370" r="380" fill="url(#glow)"/>

  <g transform="translate(512 368) scale(1.05) translate(-512 -368)">
  <!-- The camera panel -->
  <rect x="82" y="118" width="860" height="500" rx="36" fill="url(#parchment)" stroke="#c9a24c" stroke-width="14"/>

  <!-- Zoom gauge -->
  <path d="M108.0,446.0 A106,106 0 0 1 320.0,446.0" fill="none" stroke="#8a6d2b" stroke-width="12" stroke-linecap="round"/>
  <line x1="286.0" y1="446.0" x2="320.0" y2="446.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="286.7" y1="404.0" x2="305.8" y2="393.0" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="256.0" y1="373.3" x2="267.0" y2="354.2" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="214.0" y1="374.0" x2="214.0" y2="340.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="172.0" y1="373.3" x2="161.0" y2="354.2" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="141.3" y1="404.0" x2="122.2" y2="393.0" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="142.0" y1="446.0" x2="108.0" y2="446.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <text x="158" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="bold" fill="#8a6d2b">+</text>
  <text x="270" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="bold" fill="#8a6d2b">&#8722;</text>
  <line x1="214" y1="446" x2="146.6" y2="389.4" stroke="#8a6d2b" stroke-width="20" stroke-linecap="round"/>
  <line x1="214" y1="446" x2="146.6" y2="389.4" stroke="url(#goldv)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="214" cy="446" r="16" fill="url(#goldv)" stroke="#8a6d2b" stroke-width="6"/>

  <!-- Compass -->
  <circle cx="512" cy="368" r="140" fill="#f7eed1" stroke="url(#goldv)" stroke-width="16"/>
  <circle cx="512" cy="368" r="114" fill="none" stroke="#b8903f" stroke-width="4"/>
  <line x1="622.0" y1="368.0" x2="648.0" y2="368.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="596.9" y1="283.1" x2="608.2" y2="271.8" stroke="#8a6d2b" stroke-width="5" stroke-linecap="round"/>
  <line x1="512.0" y1="258.0" x2="512.0" y2="232.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="427.1" y1="283.1" x2="415.8" y2="271.8" stroke="#8a6d2b" stroke-width="5" stroke-linecap="round"/>
  <line x1="402.0" y1="368.0" x2="376.0" y2="368.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="427.1" y1="452.9" x2="415.8" y2="464.2" stroke="#8a6d2b" stroke-width="5" stroke-linecap="round"/>
  <line x1="512.0" y1="478.0" x2="512.0" y2="504.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="596.9" y1="452.9" x2="608.2" y2="464.2" stroke="#8a6d2b" stroke-width="5" stroke-linecap="round"/>
  <text x="512.0" y="306.0" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#8a6d2b">N</text>
  <text x="590.0" y="384.0" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#8a6d2b">E</text>
  <text x="512.0" y="462.0" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#8a6d2b">S</text>
  <text x="434.0" y="384.0" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#8a6d2b">W</text>
  <g transform="rotate(38 512 368)">
    <polygon points="512,268 532,368 512,468 492,368" fill="#8a6d2b"/>
    <polygon points="512,276 525,368 499,368" fill="url(#goldv)"/>
  </g>
  <circle cx="512" cy="368" r="15" fill="url(#goldv)" stroke="#8a6d2b" stroke-width="6"/>

  <!-- Angle gauge -->
  <line x1="726" y1="296" x2="726" y2="460.0" stroke="#b8903f" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/>
  <path d="M726.0,460.0 A164,164 0 0 0 890.0,296.0" fill="none" stroke="#8a6d2b" stroke-width="12" stroke-linecap="round"/>
  <line x1="726.0" y1="426.0" x2="726.0" y2="460.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="762.8" y1="433.2" x2="768.4" y2="454.4" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="797.0" y1="419.0" x2="808.0" y2="438.0" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="817.9" y1="387.9" x2="842.0" y2="412.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="849.0" y1="367.0" x2="868.0" y2="378.0" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="863.2" y1="332.8" x2="884.4" y2="338.4" stroke="#8a6d2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="856.0" y1="296.0" x2="890.0" y2="296.0" stroke="#8a6d2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="726" y1="296" x2="836.3" y2="382.2" stroke="#8a6d2b" stroke-width="20" stroke-linecap="round"/>
  <line x1="726" y1="296" x2="836.3" y2="382.2" stroke="url(#goldv)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="726" cy="296" r="16" fill="url(#goldv)" stroke="#8a6d2b" stroke-width="6"/>

  </g>
  <!-- Wordmark -->
  <text x="512" y="790" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="108"
        font-weight="bold" fill="#e7d4a3" letter-spacing="3">ZOOM, TILT,</text>
  <text x="512" y="910" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="108"
        font-weight="bold" fill="#e7d4a3" letter-spacing="3">&amp; ROTATE</text>
</svg>
